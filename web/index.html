<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Ask the Handbook</title>
    <link data-trunk rel="rust" data-wasm-opt="z" />
    <style>
      :root {
        --bg: #ffffff; --fg: #1d1d1f; --muted: #6e6e73; --border: #d2d2d7;
        --accent: #0b57d0; --error: #b3261e; --card: #f5f5f7;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #111113; --fg: #f5f5f7; --muted: #a1a1a6; --border: #3a3a3c;
          --accent: #8ab4f8; --error: #f2b8b5; --card: #1c1c1e;
        }
      }
      :root[data-theme="dark"] {
        --bg: #111113; --fg: #f5f5f7; --muted: #a1a1a6; --border: #3a3a3c;
        --accent: #8ab4f8; --error: #f2b8b5; --card: #1c1c1e;
      }
      body { margin: 0; background: var(--bg); color: var(--fg);
        font: 16px/1.5 system-ui, -apple-system, sans-serif; }
      main { max-width: 42rem; margin: 0 auto; padding: 1rem; }
      h1 { font-size: 1.6rem; margin: 0.5rem 0; }
      h2 { font-size: 1rem; margin: 1rem 0 0.25rem; }
      .hint, small, .section, .doc + .section { color: var(--muted); }
      label { display: block; margin: 0.75rem 0; font-weight: 600; }
      input, textarea { display: block; width: 100%; box-sizing: border-box; margin-top: 0.25rem;
        padding: 0.6rem; font: inherit; color: var(--fg); background: var(--card);
        border: 1px solid var(--border); border-radius: 8px; }
      button { font: inherit; padding: 0.5rem 1rem; margin: 0.25rem 0.5rem 0.25rem 0;
        color: var(--bg); background: var(--accent); border: 0; border-radius: 8px; cursor: pointer; }
      button:disabled { opacity: 0.5; cursor: default; }
      .answer { margin-top: 1rem; padding: 1rem; background: var(--card); border-radius: 12px; }
      .outcome { font-weight: 700; margin: 0 0 0.5rem; }
      .text { white-space: pre-wrap; margin: 0; }
      .error { color: var(--error); font-weight: 600; }
      .sources { padding-left: 1.25rem; }
    </style>
  </head>
  <body></body>
</html>
